# ================================================================
# TEMPLATE TOML — pipeline integrado pesquisa + paper
# Script-alvo: gerador_pesquisa_paper_rc_8.py
# Nomenclaturas padrão do projeto:
# - template_paper.org     -> template do paper
# - template_research.org  -> template da pesquisa (substitui o antigo template.org)
#
# ================================================================
# Cenários possíveis:
#
# 1) Só pesquisa
#    [pipeline]
#    executar_pesquisa = true
#    executar_bundle = false
#    executar_paper = false
#
# 2) Pesquisa + bundle + paper
#    [pipeline]
#    executar_pesquisa = true
#    executar_bundle = true
#    executar_paper = true
#
# 3) Só montar bundle a partir de uma pesquisa já pronta
#    [pipeline]
#    executar_pesquisa = false
#    executar_bundle = true
#    executar_paper = false
#    pesquisa_dir_existente = "/caminho/para/saida_da_pesquisa"
#
# 4) Só paper a partir de uma pesquisa já pronta
#    [pipeline]
#    executar_pesquisa = false
#    executar_bundle = true
#    executar_paper = true
#    pesquisa_dir_existente = "/caminho/para/saida_da_pesquisa"
#
# 5) Reescrever ou expandir o paper sem nova pesquisa, usando artigos extras
#    [pipeline]
#    executar_pesquisa = false
#    executar_bundle = true
#    executar_paper = true
#    pesquisa_dir_existente = "/caminho/para/saida_da_pesquisa"
#
#    [paper]
#    modo_escrita = "reescrever"  # novo | reescrever | expandir
#    reescrever_a_partir_do_org_atual = true
#    artigos_extras_paths = ["/caminho/pasta_com_extras"]
# ================================================================

[pipeline]
executar_pesquisa = true
executar_bundle = true
executar_paper = true
script_pesquisa = "./gerador_pesquisa_rc_1.py"
pesquisa_dir_existente = ""
# bundle_dir = "/caminho/para/paper_bundle"

[atividade]
modo = "revisao_sistematica"
disciplina = "Teorias de Administração Pública"
professor = "Bernardo Buta"
curso = "Mestrado de Políticas Públicas e Governo"
turma = "T-01"
polo = "Brasília"
aluno = "Seu nome"

[pesquisa]
tema = ""
recorte = ""
objetivo = ""
trabalho = ""
tipo_estudo = "Revisão de literatura"
periodo = "2019-2026"
idiomas = ["inglês", "português"]
bases = ["semantic_scholar", "scopus", "pubmed", "openalex", "crossref", "europe_pmc", "core"]
palavras_chave = []

[bibliografia]
estilo_citacao = "APA"

[busca]
sugerir_palavras_chave_ia = true
query_bilingue = true
quantidade_triagem = 25
quantidade_selecionados = 3
salvar_busca_bruta_json = true
incluir_analise_detalhada_ia = true
incluir_sintese_integradora_ia = true

[triagem]
rigor = "moderado"
usar_score_hibrido = true
triagem_prompt_path = "./prompts/triagem_prompt.txt"
diretivas_extras = "./prompts/diretivas_extras.txt"
permitir_textos_nao_publicos = false

[queries]
query_geral = ""
query_semantic = ""
query_scopus = ""
query_wos = ""
query_pubmed = ""
query_openalex = ""
query_crossref = ""
query_europepmc = ""
query_core = ""

[saida]
prefixo = "atividade_modelo"
output_dir = "/caminho/para/saida"
criar_subdiretorio = true
org_modelo = "/caminho/para/template_research.org"
arquivo_orientacao = ""
exportar_pdf = true
gerar_env_example = false
remover_auxiliares = true

[latex]
org_latex_class_init = "/home/gustavodetarso/.emacs.d/lisp/academic-writing.el"
latex_extra_path = "/home/gustavodetarso/texmf/tex/latex/fgv/fgv-paper.sty"
comando_exportacao_pdf = ""
fgv_logo_path = "/home/gustavodetarso/Documentos/.share/mgs_org/fgv.png"

[openai]
model = "gpt-5.4"

[controle]
nao_interativo = true
salvar_config = true
config_output = ""
dry_run = false

[paper]
template_org = "./template_paper.org"
usar_artigos_selecionados_pesquisa = true
artigos_extras_paths = []
modo_escrita = "novo"
usar_contexto_consolidado_da_pesquisa = true
reformular_tema_recorte_objetivo = false

# Se vazio, herda [bibliografia].estilo_citacao
# estilo_citacao = "APA"

# Template do paper. Se vazio, tenta template_paper.org e, como fallback organizacional, template_research.org
# template_org = "/caminho/para/template_paper.org"

# Se vazio, usa o diretório final da pesquisa como base.
# output_dir = "/caminho/para/saida/do/paper"

# Orientação genérica do paper:
# - pode ser caminho para arquivo
# - ou texto inline diretamente no TOML
orientacao = ""

# Arquivos extras opcionais tratados como orientação adicional.
guidance_paths = []

# Modo de escrita do paper:
# - novo
# - reescrever
# - expandir
modo_escrita = "novo"

# Perfil de redação:
# - academico_equilibrado
# - mais_teorico
# - mais_discursivo
# - mais_sintetico
perfil_redacao = "academico_equilibrado"

# Usa os artigos formalmente selecionados na pesquisa como base principal do paper.
usar_artigos_selecionados_pesquisa = true

# Artigos extras adicionados fora da triagem da pesquisa.
artigos_extras_paths = []

# Se true, os extras entram apenas como complemento.
extras_so_complementam = true

# Número mínimo desejado de chaves dos artigos selecionados citadas no paper.
# O script gera aviso se ficar abaixo.
minimo_citacoes_dos_selecionados = 0

# Se true, o .org anterior do paper entra como orientação adicional.
reescrever_a_partir_do_org_atual = false

# Se true, preserve a estrutura principal do .org anterior quando ele existir.
preservar_estrutura_do_org_anterior = false

# Caminho opcional para um .org anterior do paper.
paper_org_existente = ""

# Bibliografia
usar_bib_da_pesquisa = true
incluir_artigos_extras_no_bib = true
permitir_busca_correlata_extra = false
priorizar_citacoes_dos_selecionados = true

# Contexto
usar_contexto_consolidado_da_pesquisa = true
reformular_tema_recorte_objetivo = false
tema = ""
recorte = ""
objetivo = ""

# Limites opcionais de tamanho
limite_palavras_total = 0
limite_palavras_introducao = 0
limite_palavras_revisao = 0
limite_palavras_conclusao = 0

# Sobrescreve a instituição, se quiser.
# institution_name = "Faculdade Getúlio Vargas"

[entrega]
gerar_pacote_final = true
incluir_paper_pdf = true
incluir_prisma_svg = true
incluir_prisma_pdf = true

[atividade]
modo = "revisao_sistematica"
disciplina = "Teorias de Administração Pública"
professor = "Bernardo Buta"
curso = "Mestrado de Políticas Públicas e Governo"
turma = "T-01"
polo = "Brasília"
aluno = "Hugo Bustamante Tre"

[pesquisa]
tema = "Capacidades estatais e desempenho estatal, com foco na relação entre coerção, centralização do poder e resultados de políticas públicas."
recorte = "Análise da relação entre capacidades coercitivas do Estado, grau de centralização do poder político-administrativo e desempenho de políticas públicas, considerando como diferentes arranjos institucionais afetam a implementação, a efetividade e os resultados das ações estatais."
objetivo = "Investigar de que forma as capacidades estatais, especialmente a capacidade coercitiva e a centralização do poder, influenciam o desempenho estatal e os resultados de políticas públicas, identificando limites, mecanismos explicativos e possíveis tensões entre autoridade estatal, coordenação institucional e efetividade governamental."
trabalho = "Capacidades coercitivas, centralização do poder e desempenho estatal em políticas públicas: Revisão de literatura"
tipo_estudo = "Revisão de literatura"
periodo = "2019-2026"
idiomas = ["inglês", "português"]
bases = ["semantic_scholar", "scopus", "pubmed", "openalex", "crossref", "europe_pmc", "core"]
palavras_chave = ["capacidades estatais", "state capacity", "capacidade coercitiva", "coercive capacity", "coerção estatal", "state coercion", "centralização do poder", "power centralization", "political centralization", "administrative centralization", "desempenho estatal", "state performance", "policy performance", "policy outcomes", "policy implementation", "government effectiveness", "public policy outcomes", "arranjos institucionais", "institutional arrangements", "coordenação institucional", "institutional coordination", "efetividade estatal", "state effectiveness", "revisão de literatura", "literature review", "systematic review", "scoping review", "review", "revisão", "Capacidades estatais e desempenho estatal, com foco na relação entre coerção, centralização do poder e resultados de políticas públicas.", "Análise da relação entre capacidades coercitivas do Estado, grau de centralização do poder político-administrativo e desempenho de políticas públicas, considerando como diferentes arranjos institucionais afetam a implementação, a efetividade e os resultados das ações estatais.", "state capabilities"]


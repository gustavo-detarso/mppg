[pesquisa]
tema = "Uso de inteligência artificial no governo público federal como instrumento de governança, ética, compliance e gestão de riscos."
recorte = "Análise do uso de sistemas e aplicações de inteligência artificial por órgãos e entidades da administração pública federal brasileira, com ênfase nos instrumentos de governança, salvaguardas éticas, mecanismos de compliance e práticas de gestão de riscos associados à automação de processos, apoio à decisão, análise documental, fiscalização e prestação de serviços digitais, no período de 2019 a 2026."
objetivo = "Investigar como a literatura acadêmica e técnico-institucional trata a adoção de inteligência artificial no governo público federal brasileiro, identificando aplicações, modelos de governança, dilemas éticos, exigências de compliance, práticas de gestão de riscos e diretrizes para uma implementação responsável, auditável e alinhada ao interesse público."

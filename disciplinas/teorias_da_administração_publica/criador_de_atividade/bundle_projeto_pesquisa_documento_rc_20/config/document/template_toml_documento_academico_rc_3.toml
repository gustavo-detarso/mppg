# ================================================================
# TEMPLATE TOML — documento acadêmico standalone
# Script-alvo: gerador_documento_academico_rc_2.py
# ================================================================
# Este TOML é o ponto de entrada para a etapa redacional standalone.
# Ele pode gerar, por enquanto:
# - paper
# - dissertacao
#
# A lógica foi organizada para permitir futuros tipos documentais
# sem mudar a estrutura principal do arquivo.
# ================================================================

[documento]
# Tipos previstos atualmente:
# - "paper"
# - "dissertacao"
tipo_documento = "paper"

# Prefixo/nome-base dos arquivos gerados.
# Se vazio, o script usa um padrão por tipo:
# - paper -> paper
# - dissertacao -> dissertacao
prefixo = ""

# Template do documento.
# Se vazio, o script tenta:
# - paper -> template_paper.org
# - dissertacao -> template_dissertacao.org
# - fallback organizacional -> template_research.org
template_org = "./templates/template_paper.org"

# Diretório de saída do documento.
output_dir = ""

# Bundle pronto ou diretório de pesquisa já existente.
bundle_dir = ""
pesquisa_dir_existente = ""

# Estilo bibliográfico.
# Se vazio, herda [bibliografia].estilo_citacao.
estilo_citacao = ""

# PDF final do documento.
exportar_pdf = true

# Documentos-base adicionais (além dos artigos da pesquisa, quando usados).
base_docs_paths = []

# Orientações da etapa redacional.
orientacoes_paths = []
orientacao_inline = ""

# Usar os artigos selecionados da pesquisa como base principal.
usar_artigos_selecionados_pesquisa = true

# Artigos extras adicionados fora da triagem da pesquisa.
artigos_extras_paths = []

# Modo de escrita:
# - novo
# - reescrever
# - expandir
modo_escrita = "novo"

# Perfil de redação sugerido.
perfil_redacao = "academico_equilibrado"

# Contexto consolidado da pesquisa como base.
usar_contexto_consolidado_da_pesquisa = true

# Permite reformular tema/recorte/objetivo na etapa redacional.
reformular_tema_recorte_objetivo = false

# Busca correlata complementar a partir dos artefatos já presentes.
permitir_busca_correlata_extra = false

# Priorização bibliográfica.
priorizar_citacoes_dos_selecionados = true
extras_so_complementam = true
minimo_citacoes_dos_selecionados = 3
usar_bib_da_pesquisa = true
incluir_artigos_extras_no_bib = true

# Reescrita/expansão com base em um .org anterior.
reescrever_a_partir_do_org_atual = false
documento_org_existente = ""
preservar_estrutura_do_org_anterior = false

# Bibliografias extras opcionais.
bib_paths = []

# Campos de override do contexto, úteis se reformular_tema_recorte_objetivo = true
tema = ""
recorte = ""
objetivo = ""

[atividade]
disciplina = ""
professor = ""
curso = ""
turma = ""
polo = ""
aluno = ""

[bibliografia]
estilo_citacao = "APA"

[latex]
org_latex_class_init = "/home/gustavodetarso/.emacs.d/lisp/academic-writing.el"
latex_extra_path = "/home/gustavodetarso/texmf/tex/latex/fgv/fgv-paper.sty"
comando_exportacao_pdf = ""
fgv_logo_path = ""

[openai]
model = "gpt-5.4"

[controle]
nao_interativo = true
dry_run = false


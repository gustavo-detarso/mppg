prefixo = "dissertacao_ia_governo_publico_federal"
output_dir = "/home/gustavodetarso/Documentos/mppg/disciplinas/teorias_da_administração_publica/criador_de_atividade/bundle_projeto_pesquisa_documento_rc_20/output/documento"

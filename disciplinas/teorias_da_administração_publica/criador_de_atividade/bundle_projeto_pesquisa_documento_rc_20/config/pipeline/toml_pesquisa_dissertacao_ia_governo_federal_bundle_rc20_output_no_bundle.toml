orientacoes_paths = [
  "/home/gustavodetarso/Documentos/mppg/disciplinas/teorias_da_administração_publica/criador_de_atividade/bundle_projeto_pesquisa_documento_rc_20/prompts/orientacao_geral_execucao.txt",
  "/home/gustavodetarso/Documentos/mppg/disciplinas/teorias_da_administração_publica/criador_de_atividade/bundle_projeto_pesquisa_documento_rc_20/prompts/diretivas_extras.txt"
]
orientacao_inline = """
Na etapa de pesquisa, priorize a construção de um corpus conceitualmente robusto e bem delimitado, evitando inflar a aderência com textos apenas genericamente ligados a transformação digital, governo eletrônico ou inovação pública quando não houver conexão clara com inteligência artificial, governança, ética, compliance ou gestão de riscos.
"""
exportar_pdf = true
gerar_env_example = false
remover_auxiliares = true

[documento]

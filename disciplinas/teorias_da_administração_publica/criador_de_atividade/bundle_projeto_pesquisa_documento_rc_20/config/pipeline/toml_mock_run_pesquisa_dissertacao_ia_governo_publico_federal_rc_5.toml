# ================================================================
# TOML mock_run — pesquisa + dissertação
# Tema: uso de inteligência artificial no governo público federal
# Script-alvo: gerador_pesquisa_documento_rc_5.py
# ================================================================

[pipeline]
executar_pesquisa = true
executar_bundle = true
executar_documento = true
pesquisa_dir_existente = ""
script_pesquisa = "./scripts/research/gerador_pesquisa_rc_2.py"

[atividade]
modo = "revisao_sistematica"
disciplina = "Dissertação de Mestrado"
professor = "Orientador(a) a definir"
curso = "Mestrado Profissional em Políticas Públicas e Governo"
turma = ""
polo = "Brasília"
aluno = "Seu nome"

[pesquisa]
tema = "Uso de inteligência artificial no governo público federal como instrumento de governança, ética, compliance e gestão de riscos."
recorte = "Análise do uso de sistemas e aplicações de inteligência artificial por órgãos e entidades da administração pública federal brasileira, com ênfase em governança, ética, compliance e gestão de riscos, no período de 2019 a 2026."
objetivo = "Investigar como a literatura acadêmica e técnico-institucional trata a adoção de inteligência artificial no governo público federal brasileiro, identificando aplicações, modelos de governança, dilemas éticos, exigências de compliance, práticas de gestão de riscos e diretrizes para uma implementação responsável."
trabalho = "Dissertação"
tipo_estudo = "Revisão de literatura"
periodo = "2019-2026"
idiomas = ["inglês", "português"]
palavras_chave = []
bases = ["semantic_scholar", "scopus", "pubmed", "openalex", "crossref", "europe_pmc", "core"]

[bibliografia]
estilo_citacao = "APA"

[busca]
sugerir_palavras_chave_ia = true
query_bilingue = true
quantidade_triagem = 140
quantidade_selecionados = 40
salvar_busca_bruta_json = true
incluir_analise_detalhada_ia = true
incluir_sintese_integradora_ia = true

[triagem]
rigor = "moderado"
usar_score_hibrido = true
orientacoes_paths = [
  "./prompts/triagem_prompt.txt",
  "./prompts/diretivas_extras.txt"
]
orientacao_inline = """
A triagem deve priorizar estudos substantivamente conectados à adoção de inteligência artificial no governo público federal, especialmente quando o texto tratar de governança algorítmica, accountability, ética pública, compliance regulatório, integridade, auditoria, transparência, avaliação de riscos, discricionariedade automatizada, explicabilidade, supervisão humana, proteção de dados, contratação pública tecnológica e controles institucionais sobre IA.
"""
permitir_textos_nao_publicos = false

[queries]
query_geral = ""
query_semantic = ""
query_scopus = ""
query_wos = ""
query_pubmed = ""
query_openalex = ""
query_crossref = ""
query_europepmc = ""
query_core = ""

[saida]
prefixo = "dissertacao_ia_governo_publico_federal"
output_dir = "./output"
criar_subdiretorio = true
org_modelo = "./templates/template_research.org"
orientacoes_paths = [
  "./prompts/orientacao_geral_execucao.txt",
  "./prompts/diretivas_extras.txt"
]
orientacao_inline = """
Na etapa de pesquisa, priorize um corpus conceitualmente robusto e bem delimitado.
"""
exportar_pdf = true
gerar_env_example = false
remover_auxiliares = true

[documento]
tipo_documento = "dissertacao"
prefixo = "dissertacao_ia_governo_publico_federal"
criar_subdiretorio = true
template_org = "./templates/template_dissertacao_fgv_apa_v2.org"
exportar_pdf = true
orientacoes_paths = [
  "./prompts/orientacao_geral_execucao.txt",
  "./docs/modelos/fgv/formatacao-de-trabalhos-academicos-manual-fgv-impressao-2025.pdf",
  "./docs/modelos/fgv/modelo-de-dissertacao-2025.docx"
]
orientacao_inline = """
Produza uma DISSERTAÇÃO, não um paper curto.
Use os estudos selecionados na etapa de pesquisa como base principal.
Mantenha estrutura em seções.
"""
usar_artigos_selecionados_pesquisa = true
artigos_extras_paths = []
modo_escrita = "novo"
perfil_redacao = "academico_equilibrado"
usar_contexto_consolidado_da_pesquisa = true
reformular_tema_recorte_objetivo = false
permitir_busca_correlata_extra = false
priorizar_citacoes_dos_selecionados = true
extras_so_complementam = true
minimo_citacoes_dos_selecionados = 20
usar_bib_da_pesquisa = true
incluir_artigos_extras_no_bib = true
reescrever_a_partir_do_org_atual = false
documento_org_existente = ""
preservar_estrutura_do_org_anterior = false

[latex]
org_latex_class_init = "./misc/academic-writing.el"
latex_extra_path = "./misc/fgv/fgv-dissertacao.sty"
comando_exportacao_pdf = ""
fgv_logo_path = ""

[openai]
model = "gpt-5.4"

[controle]
nao_interativo = true
dry_run = false
mock_run = true
mock_seed = 42
mock_quantidade_registros = 40
mock_gerar_pdf = true

# IMPORTANTE:
# Para a dissertação usar o perfil correto, renomeie no bundle:
#   ./bundle_projeto_pesquisa_documento_rc_20/misc/fgv/fgv-dissertacao_v2.sty
# para:
#   ./bundle_projeto_pesquisa_documento_rc_20/misc/fgv/fgv-dissertacao.sty
#
# Motivo:
# - o template de dissertação usa LATEX_CLASS = fgv-dissertacao
# - o academic-writing.el registra a classe fgv-dissertacao
# - a classe carrega \usepackage{fgv-dissertacao}
# - portanto o arquivo .sty precisa ter esse nome
#
# Regra arquitetural final:
# - paper -> template_paper.org + fgv-paper.sty
# - dissertacao -> template_dissertacao_fgv_apa_v2.org + fgv-dissertacao.sty
# ================================================================


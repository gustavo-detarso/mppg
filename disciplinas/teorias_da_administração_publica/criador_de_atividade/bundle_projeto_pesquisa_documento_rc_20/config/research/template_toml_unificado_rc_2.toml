# ================================================================
# TEMPLATE TOML UNIFICADO — revisão sistemática/PRISMA OU pesquisa empírica
# ================================================================
# COMO USAR
# 1) Preencha primeiro [atividade] e [pesquisa].
# 2) Em [atividade].modo, escolha APENAS UM:
#    - "revisao_sistematica"  -> fluxo PRISMA
#    - "pesquisa_empirica"    -> projeto/roteiro de pesquisa empírica
# 3) Campos marcados como "somente PRISMA" são ignorados no modo empírico.
# 4) Se você quiser geração automática por IA, deixe palavras_chave = []
#    e mantenha as query_* vazias.
# 5) Este arquivo NÃO guarda chaves de API. Elas devem ficar no .env.
# ================================================================
# Nomenclaturas unificadas de orientação externa
# - [saida].orientacoes_paths   -> arquivos de orientação geral da pesquisa
# - [saida].orientacao_inline   -> texto inline de orientação geral da pesquisa
# - [triagem].orientacoes_paths -> arquivos de orientação específicos da triagem
# - [triagem].orientacao_inline -> texto inline específico da triagem
#
# Observação:
# As mesmas chaves aparecem em mais de uma seção, mas com função diferente
# conforme a seção onde forem usadas.
#

[atividade]
modo = "revisao_sistematica"
disciplina = ""
professor = ""
curso = ""
turma = ""
polo = ""
aluno = ""

[pesquisa]
tema = ""
recorte = ""
objetivo = ""

# Deixe vazio para o título ser sugerido pela IA.
trabalho = ""

# Exemplos PRISMA:
# - "Revisão sistemática"
# - "Revisão de literatura"
# - "Scoping review"
# - "Metanálise"
# Exemplos empírico:
# - "Estudo de caso"
# - "Estudo qualitativo"
# - "Estudo quantitativo"
# - "Métodos mistos"
# - "Survey"
tipo_estudo = ""

# Somente PRISMA.
periodo = "2019-2026"

idiomas = ["inglês", "português"]

# Somente PRISMA.
# Valores canônicos reconhecidos pelo script:
# "semantic_scholar", "scopus", "web_of_science", "pubmed",
# "openalex", "crossref", "europe_pmc", "core"
bases = ["semantic_scholar", "scopus", "pubmed", "openalex", "crossref", "europe_pmc", "core"]

# Deixe vazio para a IA gerar palavras-chave/conceitos a partir da tríade
# tema-recorte-objetivo e do tipo de estudo.
palavras_chave = []

[bibliografia]
# Somente PRISMA. Valores usuais: ABNT, APA, Chicago, MLA, Vancouver
estilo_citacao = "APA"

[busca]
# Nos dois modos, a IA pode sugerir palavras-chave.
sugerir_palavras_chave_ia = true

# Mais útil no PRISMA, mas pode permanecer true também no empírico.
query_bilingue = true

# Somente PRISMA.
quantidade_triagem = 25
quantidade_selecionados = 3
salvar_busca_bruta_json = true
incluir_analise_detalhada_ia = true
incluir_sintese_integradora_ia = true

[triagem]
# Somente PRISMA. Valores: estrito, moderado, exploratorio
rigor = "moderado"

# Somente PRISMA. Ativa score híbrido local + IA na triagem/ranking.
usar_score_hibrido = true

# Somente PRISMA. Caminho opcional para arquivo .txt/.md/.org com
# diretivas específicas de triagem.
# Somente PRISMA.
# Arquivos de orientação específicos de triagem/ranking.
# Pode usar um ou mais arquivos.
orientacoes_paths = []

# Somente PRISMA.
# Texto inline adicional para triagem/ranking.
orientacao_inline = ""

# Somente PRISMA.
permitir_textos_nao_publicos = false

[queries]
# Somente PRISMA.
# Deixe tudo vazio para o Python montar automaticamente as queries.
query_geral = ""
query_semantic = ""
query_scopus = ""
query_wos = ""
query_pubmed = ""
query_openalex = ""
query_crossref = ""
query_europepmc = ""
query_core = ""

[saida]
prefixo = ""

# Diretório-base onde a saída será salva.
output_dir = ""

# Se true, o script cria uma subpasta com o prefixo.
criar_subdiretorio = true

# Caminho do modelo .org.
org_modelo = "template_research.org"

# Arquivos de orientação gerais da etapa de pesquisa.
# Pode usar um ou mais arquivos (.txt, .md, .org, .docx, .pdf).
orientacoes_paths = []

# Texto inline adicional de orientação geral da etapa de pesquisa.
orientacao_inline = ""

exportar_pdf = true
gerar_env_example = false
remover_auxiliares = true

[latex]
# Arquivo .el que registra a classe LaTeX no Emacs batch.
org_latex_class_init = ""

# Pode ser um .sty, uma pasta ou o caminho que você usa no projeto.
latex_extra_path = ""

# Se quiser deixar o script usar o padrão, deixe string vazia.
comando_exportacao_pdf = ""

fgv_logo_path = ""

[openai]
model = "gpt-5.4"

[controle]
# Se true, evita perguntas interativas e força uso do TOML/CLI.
nao_interativo = true

# Se true, o script salva uma cópia da configuração final em TOML.
salvar_config = true

# Caminho do TOML final salvo pelo script.
config_output = ""


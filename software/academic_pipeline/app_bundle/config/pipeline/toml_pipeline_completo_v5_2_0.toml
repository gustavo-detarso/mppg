# ================================================================
# TOML COMPLETO — Pipeline pesquisa/documento v5.2.0
# Bundle-alvo: bundle_projeto_pesquisa_documento_rc_20
#
# Este TOML foi pensado para funcionar como arquivo central de configuração,
# permitindo escolher entre três modos principais:
#
# 1) modo_entrada = "pesquisa"
#    Executa pesquisa acadêmica/PRISMA do zero e pode gerar documento depois.
#
# 2) modo_entrada = "pesquisa_existente"
#    Usa uma pesquisa já pronta em [pipeline].pesquisa_dir_existente.
#
# 3) modo_entrada = "documentos_locais"
#    Usa ZIP ou pasta local com textos fornecidos pelo professor/usuário,
#    criando um corpus local equivalente ao *_fulltext_cache da pesquisa.
#
# Observação:
# - A v5.2.0 prioriza os textos efetivamente disponíveis no fulltext_cache.
# - Para documentos locais, configure [documentos_locais] e use template leve.
# ================================================================

[pipeline]
# Opções: "pesquisa", "pesquisa_existente", "documentos_locais"
modo_entrada = "pesquisa"

# Pesquisa PRISMA do zero.
executar_pesquisa = true

# Geração de pacote/bundle intermediário/final.
executar_bundle = false

# Geração do documento acadêmico final.
executar_documento = false

# Use somente quando modo_entrada = "pesquisa_existente".
# Exemplo:
# pesquisa_dir_existente = "/home/.../bundle_projeto_pesquisa_documento_rc_20/output/pesquisa/dissertacao_ia_governo_publico_federal"
pesquisa_dir_existente = ""

script_pesquisa = "/home/gustavodetarso/Documentos/mppg/software/academic_pipeline/bundle_projeto_pesquisa_documento_rc_20/scripts/research/gerador_pesquisa_rc_2.py"

# Se vazio, o script decide o local padrão conforme o modo.
bundle_dir = ""


# ================================================================
# Entrada por documentos locais/ZIP
# ================================================================
[documentos_locais]
# Ative para usar ZIP ou pasta local.
# Quando true, também equivale a modo_entrada = "documentos_locais".
ativos = false

# Pode repetir aqui, se quiser controlar o modo pela própria seção.
# Opções aceitas pela v5.2.0: "documentos_locais", "local", "zip", "pasta_local".
modo_entrada = "documentos_locais"

# Use ZIP OU pasta. Se input_zip estiver preenchido, ele tem prioridade.
input_zip = ""
input_dir = ""

# Busca arquivos em subpastas.
recursive = true

# Tipos lidos no corpus local.
tipos = ["pdf", "docx", "txt", "md", "org"]

# Prefixo do corpus local. Se vazio, usa [documento].prefixo ou [saida].prefixo.
prefixo = ""

# Saída do corpus local convertido em estrutura compatível com pesquisa.
output_dir = "/home/gustavodetarso/Documentos/mppg/software/academic_pipeline/bundle_projeto_pesquisa_documento_rc_20/output/corpus_local"
criar_subdiretorio = true

# Limpeza de execuções anteriores.
limpar_extracao_anterior = true
limpar_cache_anterior = true
sobrescrever_corpus_local = true

# Cria prefixo_fulltext_cache/ com os documentos originais ou extraídos.
copiar_para_fulltext_cache = true

# Cria debug.json e .bib sintéticos para o corpus local.
gerar_debug_sintetico = true
gerar_bib_sintetico = true

# Usa nome do arquivo como chave bibliográfica se não houver metadados.
usar_nome_arquivo_como_chave = true

# Metadados bibliográficos padrão para documentos locais sem metadados.
autor_padrao = "Material fornecido pelo professor"
ano_padrao = "s.d."

# Controle semântico: no modo documentos locais, os textos do cache devem ser
# interpretados pela IA e usados substantivamente no documento final.
gerar_resumo_individual = true
gerar_contexto_consolidado = true
exigir_uso_de_todos_os_documentos = true
responder_exclusivamente_com_base_nos_documentos = true
permitir_fontes_externas = false

# Segurança operacional.
ignorar_arquivos_ocultos = true
min_caracteres_documento_valido = 500


# ================================================================
# Atividade / metadados acadêmicos gerais

<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1180" viewBox="0 0 1800 1180">
  <defs>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #111827; }
      .subtitle { font: 400 16px Arial, sans-serif; fill: #4b5563; }
      .box { fill: #f8fafc; stroke: #334155; stroke-width: 2.2; rx: 18; ry: 18; }
      .box2 { fill: #eef6ff; stroke: #1d4ed8; stroke-width: 2.4; rx: 18; ry: 18; }
      .box3 { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2.4; rx: 18; ry: 18; }
      .box4 { fill: #ecfdf5; stroke: #059669; stroke-width: 2.4; rx: 18; ry: 18; }
      .heading { font: 700 22px Arial, sans-serif; fill: #0f172a; }
      .text { font: 16px Arial, sans-serif; fill: #1f2937; }
      .small { font: 15px Arial, sans-serif; fill: #374151; }
      .arrow { stroke: #475569; stroke-width: 3.2; fill: none; marker-end: url(#arrowhead); }
      .muted { font: 600 15px Arial, sans-serif; fill: #475569; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#475569" />
    </marker>
  </defs>

  <text x="70" y="55" class="title">Arquitetura do bundle — pesquisa e documento acadêmico</text>
  <text x="70" y="84" class="subtitle">Fluxo principal, motores internos e artefatos gerados</text>

  <!-- Entry layer -->
  <rect x="70" y="130" width="500" height="210" class="box2"/>
  <text x="100" y="170" class="heading">1. Gerador de pesquisa</text>
  <text x="100" y="205" class="text">scripts/research/gerador_pesquisa_rc_2.py</text>
  <text x="100" y="245" class="small">• lê tema, recorte e objetivo</text>
  <text x="100" y="273" class="small">• executa busca, triagem e seleção</text>
  <text x="100" y="301" class="small">• gera pesquisa em .org, .bib, .json</text>
  <text x="100" y="329" class="small">• pode compilar PDF e fluxograma PRISMA</text>

  <rect x="645" y="130" width="500" height="210" class="box3"/>
  <text x="675" y="170" class="heading">2. Pipeline integrado</text>
  <text x="675" y="205" class="text">scripts/pipeline/gerador_pesquisa_documento_rc_2.py</text>
  <text x="675" y="245" class="small">• orquestra pesquisa + bundle + documento</text>
  <text x="675" y="273" class="small">• pode reaproveitar pesquisa já pronta</text>
  <text x="675" y="301" class="small">• preserva .org da pesquisa e do documento</text>
  <text x="675" y="329" class="small">• monta entrega final e proveniência</text>

  <rect x="1220" y="130" width="500" height="210" class="box4"/>
  <text x="1250" y="170" class="heading">3. Motor standalone de documento</text>
  <text x="1250" y="205" class="text">scripts/document/gerador_documento_academico_rc_3.py</text>
  <text x="1250" y="245" class="small">• gera somente o documento final</text>
  <text x="1250" y="273" class="small">• suporta paper e dissertação</text>
  <text x="1250" y="301" class="small">• usa pesquisa pronta, bundle ou extras</text>
  <text x="1250" y="329" class="small">• reescreve ou expande documento existente</text>

  <!-- Core writer -->
  <rect x="430" y="450" width="930" height="240" class="box"/>
  <text x="465" y="490" class="heading">4. Núcleo de redação via IA</text>
  <text x="465" y="525" class="text">scripts/document/gerar_documento_org_ai_interativo_rc_1.py</text>
  <text x="465" y="565" class="small">Recebe: template .org, contexto consolidado, bibliografia, orientações externas,</text>
  <text x="465" y="593" class="small">artigos selecionados da pesquisa e artigos extras.</text>
  <text x="465" y="633" class="small">Entrega: documento acadêmico em .org editável, artefatos de contexto,</text>
  <text x="465" y="661" class="small">auditoria de prompts e PDF opcional.</text>

  <!-- Templates/config -->
  <rect x="70" y="760" width="500" height="280" class="box"/>
  <text x="100" y="800" class="heading">5. Templates e configurações</text>
  <text x="100" y="842" class="small">templates/template_research.org</text>
  <text x="100" y="870" class="small">templates/template_paper.org</text>
  <text x="100" y="898" class="small">templates/template_dissertacao.org</text>
  <text x="100" y="940" class="small">config/research/template_toml_unificado_rc_2.toml</text>
  <text x="100" y="968" class="small">config/pipeline/template_toml_pipeline_pesquisa_documento_rc_2.toml</text>
  <text x="100" y="996" class="small">config/document/template_toml_documento_academico_rc_3.toml</text>

  <!-- Outputs -->
  <rect x="645" y="760" width="500" height="280" class="box"/>
  <text x="675" y="800" class="heading">6. Artefatos gerados</text>
  <text x="675" y="842" class="small">• pesquisa.org</text>
  <text x="675" y="870" class="small">• documento.org</text>
  <text x="675" y="898" class="small">• referencias.bib</text>
  <text x="675" y="926" class="small">• contexto.json / proveniencia.json</text>
  <text x="675" y="954" class="small">• mapa de uso das referências</text>
  <text x="675" y="982" class="small">• entrega_final/</text>

  <!-- Guidance -->
  <rect x="1220" y="760" width="500" height="280" class="box"/>
  <text x="1250" y="800" class="heading">7. Orientações externas</text>
  <text x="1250" y="842" class="small">• orientacoes_paths = [ ... ]</text>
  <text x="1250" y="870" class="small">• orientacao_inline = "..."</text>
  <text x="1250" y="912" class="small">Podem ser aplicadas na pesquisa,</text>
  <text x="1250" y="940" class="small">na triagem e no documento final,</text>
  <text x="1250" y="968" class="small">incluindo dissertação.</text>

  <!-- Arrows -->
  <line x1="570" y1="235" x2="645" y2="235" class="arrow"/>
  <line x1="1145" y1="235" x2="1220" y2="235" class="arrow"/>
  <line x1="895" y1="340" x2="895" y2="450" class="arrow"/>
  <line x1="1470" y1="340" x2="1070" y2="450" class="arrow"/>
  <line x1="320" y1="340" x2="720" y2="450" class="arrow"/>
  <line x1="320" y1="760" x2="600" y2="690" class="arrow"/>
  <line x1="1470" y1="760" x2="1185" y2="690" class="arrow"/>
  <line x1="895" y1="690" x2="895" y2="760" class="arrow"/>

  <text x="870" y="430" class="muted">redação e montagem</text>
</svg>

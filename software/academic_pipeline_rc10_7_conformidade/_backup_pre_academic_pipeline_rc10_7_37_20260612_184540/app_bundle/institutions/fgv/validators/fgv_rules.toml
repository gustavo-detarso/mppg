# Regras resumidas do perfil FGV 2025.
# Usadas por check-config/doctor e por futuras validações visuais.

[layout]
papel = "A4"
margens_cm = { superior = 3, esquerda = 3, direita = 2, inferior = 2 }
fonte_texto_pt = 12
fonte_auxiliar_pt = 10
espacamento_texto = 1.5
recuo_primeira_linha_cm = 1.25
recuo_citacao_longa_cm = 4

[bibliografia]
sistema_citacao = "autor-data"
estilo_padrao = "abnt"
referencias_ordenacao = "alfabetica"
referencias_espacamento = 1.0
notas_referencia = false

[dissertacao]
obrigatorios = ["capa", "folha_rosto", "ficha_catalografica", "folha_aprovacao", "resumo", "abstract", "sumario", "referencias"]
opcionais = ["dedicatoria", "agradecimentos", "epigrafe", "listas", "glossario", "apendice", "anexo", "indice"]

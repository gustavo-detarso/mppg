[instituicao]
nome = "Fundação Getulio Vargas"
sigla = "FGV"
manual = "Manual da FGV de Normalização de Trabalhos Acadêmicos"
versao_manual = "2025"
observacao = "Perfil baseado no manual FGV 2025 e no modelo de dissertação 2025 fornecidos pelo usuário."

[defaults.atividade]
curso = "Mestrado Acadêmico em Políticas Públicas e Governo"
polo = "Brasília"

[defaults.documento]
institution_name = "Fundação Getulio Vargas"
program_name = ""
course_name = "Mestrado Acadêmico em Políticas Públicas e Governo"
city_name = "Brasília"
estilo_citacao = "abnt"
exportar_pdf = true
exportar_docx = true
gerar_documento_json = true
modo_renderizacao = "document_model"

[defaults.bibliografia]
estilo_citacao = "abnt"
latex_style = "abnt"
docx_csl = "app://templates/csl/associacao-brasileira-de-normas-tecnicas.csl"

[defaults.latex]
pdf_engine = "lualatex"
org_latex_class_init = "app://misc/academic-writing.el"
latex_extra_path = "profile://latex"
fgv_logo_path = "app://misc/fgv.png"

[defaults.docx]
ativo = true
reference_docx = "profile://docx/reference_fgv.docx"
usar_pandoc = false
csl_path = "app://templates/csl/associacao-brasileira-de-normas-tecnicas.csl"
falhar_se_pandoc_falhar = false

[document_types.paper.documento]
tipo_documento = "paper"
template_org = "profile://templates/template_paper.org"
template_path = "profile://templates/template_paper.org"
papertype = "Paper acadêmico"
covernote = "Trabalho acadêmico elaborado para a disciplina."
normalizar_capa_paper = true

[document_types.atividade.documento]
tipo_documento = "atividade"
template_org = "profile://templates/template_atividade.org"
template_path = "profile://templates/template_atividade.org"
papertype = "Atividade acadêmica"
covernote = "Trabalho acadêmico elaborado para a disciplina."

[document_types.dissertacao.documento]
tipo_documento = "dissertacao"
template_org = "profile://templates/template_dissertacao.org"
template_path = "profile://templates/template_dissertacao.org"
papertype = "Dissertação"
program_name = "Mestrado Acadêmico em Políticas Públicas e Governo"
area_de_concentracao = "Políticas Públicas e Governo"
natureza_trabalho = "Dissertação apresentada à Fundação Getulio Vargas, como requisito para obtenção do título de Mestre em Políticas Públicas e Governo."
ficha_catalografica = "obrigatoria_na_versao_final"
exigir_resumo = true
exigir_abstract = true
exigir_sumario = true

[formatacao]
papel = "A4"
margem_superior_cm = 3
margem_esquerda_cm = 3
margem_direita_cm = 2
margem_inferior_cm = 2
fonte_principal = "Times New Roman"
fonte_alternativa = "Arial"
fonte_texto_pt = 12
fonte_elementos_auxiliares_pt = 10
espacamento_texto = 1.5
espacamento_referencias = 1.0
recuo_primeira_linha_cm = 1.25
recuo_citacao_longa_cm = 4
sistema_citacao = "autor-data"

[validacao]
falhar_se_programa_igual_curso_em_paper = true
referencias_alinhamento = "esquerda"
referencias_espacamento = 1.0
secoes_primarias_iniciam_nova_pagina = true
exigir_sistema_autor_data = true
notas_referencia = false

# -----------------------------------------------------------------------------
# rc10.7.31 — layouts institucionais explícitos
# -----------------------------------------------------------------------------
# A partir desta versão, o pipeline pode separar:
# - tipo_conteudo: o que será escrito pela IA;
# - genero_academico: atividade, paper, dissertacao etc.;
# - layout: família visual/institucional;
# - classe_latex/template/validador: detalhes institucionais de renderização.

[layouts.atividade_fgv]
genero_academico = "atividade"
front_matter = "atividade_fgv"
classe_latex = "fgv-paper"
template = "profile://templates/template_atividade.org"
validator = "profile://validators/atividade_rules.toml"
description = "Atividade acadêmica FGV com Ficha Técnica, logo e barra degradê."

[layouts.paper_fgv]
genero_academico = "paper"
front_matter = "paper_fgv"
classe_latex = "fgv-paper"
template = "profile://templates/template_paper.org"
validator = "profile://validators/paper_rules.toml"
description = "Paper acadêmico FGV."

[layouts.dissertacao_fgv]
genero_academico = "dissertacao"
front_matter = "dissertacao_fgv"
classe_latex = "fgv-dissertacao"
template = "profile://templates/template_dissertacao.org"
validator = "profile://validators/dissertacao_rules.toml"
description = "Dissertação FGV."

[document_content_types.resumo_artigos.documento]
tipo_conteudo = "resumo_artigos"
genero_academico = "atividade"
layout = "atividade_fgv"
papertype = "Resumo analítico de artigos"
perfil_redacao = "academico_analitico_comparativo"

[document_content_types.resumo_artigos]
default_layout = "atividade_fgv"
prompt = "app://prompts/document/resumo_artigos.txt"
description = "Resumo analítico-comparativo de artigos do corpus local."

[bibliografia]
estilo_citacao = "abnt"
latex_style = "abnt"
sistema_citacao = "autor-data"
backend = "biber"
ativo = true

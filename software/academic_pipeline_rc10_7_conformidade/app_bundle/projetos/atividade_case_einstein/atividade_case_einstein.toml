# Gerado por academic_pipeline_toml_generator_interativo.py
# Preset: atividade_local_fgv — Atividade local FGV
# Descrição: Gera atividade acadêmica com Ficha Técnica FGV a partir de corpus local. Não faz busca externa nem relatório PRISMA.

[projeto]
nome = "atividade_case_einstein"
descricao = "Gera atividade acadêmica com Ficha Técnica FGV a partir de corpus local. Não faz busca externa nem relatório PRISMA."
preset = "atividade_local_fgv"

[instituicao]
perfil = "fgv"

[openai]
model = "gpt-5.4"

[pipeline]
modo_entrada = "documentos_locais"
executar_pesquisa = false
executar_documento = true
executar_bundle = false
pesquisa_dir_existente = ""

[paths]
# A partir da rc10.7.20, todos os diretórios de saída/cache/trabalho ficam aqui.
document_output_dir = "output"
research_output_dir = "output_pesquisa"
work_dir = ".academic_pipeline/work"
cache_dir = ".academic_pipeline/cache"
document_prefix = "atividade_case_einstein"
research_prefix = "relatorio_prisma"
create_document_subdir = true
create_research_subdir = true
create_work_subdir = true
create_cache_subdir = true

[orientacoes]
paths = []
inline = "Dados da atividade devem ser inferidos pela IA a partir do corpus local, das orientações gerais, do prompt específico e dos metadados acadêmicos disponíveis. Inferir tema, recorte, objetivo, pergunta orientadora, enunciado operacional e palavras-chave sem inventar conteúdo fora do material fornecido.\nInferir automaticamente palavras-chave acadêmicas a partir do tema, da pergunta orientadora, do enunciado, das orientações e do corpus local; não solicitar palavras-chave ao usuário.\n\nNão inclua citações no corpo do texto, notas bibliográficas, seção Referências, lista bibliográfica ou arquivo .bib. Use exclusivamente as informações fornecidas no corpus local e não invente fontes, autores, obras, links ou dados.\n\nO corpus local foi fornecido como texto pronto. Preserve a estrutura, os argumentos, as distinções e as ressalvas do texto-base. Limite-se à revisão, organização e adequação ao formato institucional; não acrescente dados, exemplos, fontes ou interpretações externas."

[documentos_locais]
ativos = true
modo_entrada = "documentos_locais"
input_zip = ""
input_dir = "fontes"
tipos = ["pdf", "docx", "txt", "md", "org"]
recursive = true
limpar_extracao_anterior = true
